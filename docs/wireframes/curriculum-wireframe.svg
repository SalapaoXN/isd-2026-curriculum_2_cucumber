<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CUCUMBER Curriculum Document — Low-fidelity wireframe</title>
  <desc id="desc">Week 11 grayscale desktop wireframe showing global navigation, filters, course result table, course details, and pagination.</desc>
  <defs><style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #252525; }
    .small { font-size: 14px; } .body { font-size: 16px; } .label { font-size: 15px; font-weight: 700; }
    .section { font-size: 20px; font-weight: 700; } .heading { font-size: 29px; font-weight: 700; }
    .muted { fill: #666; } .light { fill: #ccc; } .white { fill: #fff; }
    .panel { fill: #fff; stroke: #777; stroke-width: 1.4; } .control { fill: #f4f4f4; stroke: #888; stroke-width: 1.1; }
    .grid { stroke: #aaa; stroke-width: 1; }
  </style></defs>
  <g id="page-background"><rect width="1600" height="900" fill="#ededed"/></g>
  <g id="global-sidebar">
    <rect width="220" height="900" fill="#333"/>
    <rect x="22" y="24" width="42" height="42" fill="#f4f4f4" stroke="#aaa"/>
    <text x="43" y="53" text-anchor="middle" class="section">C</text>
    <text x="76" y="45" class="section white">CUCUMBER</text><text x="76" y="66" class="small white">Curriculum Assistant</text>
    <rect x="16" y="112" width="188" height="48" fill="none" stroke="#888"/>
    <text x="36" y="143" class="body white">Chat</text>
    <rect x="16" y="169" width="188" height="54" fill="#555" stroke="#aaa"/>
    <text x="36" y="192" class="small white">Curriculum</text><text x="36" y="212" class="small white">document</text>
    <line x1="18" y1="824" x2="202" y2="824" stroke="#888"/>
    <circle cx="31" cy="851" r="6" fill="#ddd"/>
    <text x="47" y="856" class="small white">System status</text>
    <text x="47" y="877" class="small light">Ready</text>
  </g>
  <g id="curriculum-main">
    <text x="254" y="63" class="heading">Curriculum document</text>
    <text x="254" y="91" class="body muted">Browse course records by program, edition, and plan.</text>
    <g id="filter-section">
      <rect x="254" y="116" width="1308" height="216" class="panel"/>
      <g class="small muted">
        <text x="274" y="149">Program</text><text x="482" y="149">Curriculum Edition</text><text x="690" y="149">Plan</text>
        <text x="898" y="149">Year</text><text x="1106" y="149">Semester</text><text x="1314" y="149">Search</text>
      </g>
      <g id="filter-controls">
        <rect x="274" y="160" width="190" height="42" class="control"/><text x="288" y="187" class="body">IT  ⌄</text>
        <rect x="482" y="160" width="190" height="42" class="control"/><text x="496" y="187" class="body">2024 edition  ⌄</text>
        <rect x="690" y="160" width="190" height="42" class="control"/><text x="704" y="187" class="body">Plan A  ⌄</text>
        <rect x="898" y="160" width="190" height="42" class="control"/><text x="912" y="187" class="body">Year 2  ⌄</text>
        <rect x="1106" y="160" width="190" height="42" class="control"/><text x="1120" y="187" class="body">Semester 1  ⌄</text>
        <rect x="1314" y="160" width="228" height="42" class="control"/><text x="1328" y="187" class="body muted">Course name or code</text>
        <rect x="274" y="220" width="136" height="44" fill="#ddd" stroke="#777"/><text x="342" y="248" text-anchor="middle" class="label">Search</text>
        <text x="434" y="248" class="body">Results: <tspan font-weight="700">24 courses</tspan></text>
        <text x="1390" y="248" class="body muted">Page 1 / 3</text>
      </g>
    </g>
    <g id="course-results-table">
      <rect x="254" y="354" width="820" height="468" class="panel"/>
      <text x="274" y="386" class="section">Course results</text>
      <rect x="270" y="401" width="788" height="44" fill="#e4e4e4" stroke="#999"/>
      <text x="282" y="429" class="small label">Program</text><text x="376" y="429" class="small label">Code</text>
      <text x="490" y="429" class="small label">Name</text><text x="790" y="429" class="small label">Credits</text>
      <text x="876" y="429" class="small label">Y/S</text><text x="950" y="429" class="small label">Plan</text>
      <g id="course-rows">
        <rect x="270" y="445" width="788" height="61" fill="#eee" stroke="#aaa"/>
        <text x="282" y="481" class="small">IT</text><text x="376" y="481" class="small">06016401</text><text x="490" y="481" class="small">Data Structures</text><text x="790" y="481" class="small">3</text><text x="876" y="481" class="small">2/1</text><text x="950" y="481" class="small">Plan A</text>
        <rect x="270" y="506" width="788" height="61" fill="#fff" stroke="#bbb"/>
        <text x="282" y="542" class="small">IT</text><text x="376" y="542" class="small">06016402</text><text x="490" y="542" class="small">Database Systems</text><text x="790" y="542" class="small">3</text><text x="876" y="542" class="small">2/1</text><text x="950" y="542" class="small">Plan A</text>
        <rect x="270" y="567" width="788" height="61" fill="#fff" stroke="#bbb"/>
        <text x="282" y="603" class="small">IT</text><text x="376" y="603" class="small">06016403</text><text x="490" y="603" class="small">Systems Analysis</text><text x="790" y="603" class="small">3</text><text x="876" y="603" class="small">2/2</text><text x="950" y="603" class="small">Plan A</text>
        <rect x="270" y="628" width="788" height="61" fill="#fff" stroke="#bbb"/>
        <text x="282" y="664" class="small">IT</text><text x="376" y="664" class="small">06016404</text><text x="490" y="664" class="small">Web Application Design</text><text x="790" y="664" class="small">3</text><text x="876" y="664" class="small">2/2</text><text x="950" y="664" class="small">Plan A</text>
        <rect x="270" y="689" width="788" height="61" fill="#fff" stroke="#bbb"/>
        <text x="282" y="725" class="small">IT</text><text x="376" y="725" class="small">06016405</text><text x="490" y="725" class="small">Software Engineering</text><text x="790" y="725" class="small">3</text><text x="876" y="725" class="small">2/2</text><text x="950" y="725" class="small">Plan A</text>
      </g>
      <g id="pagination">
        <rect x="274" y="765" width="106" height="40" class="control"/><text x="327" y="791" text-anchor="middle" class="small">← Prev</text>
        <rect x="392" y="765" width="106" height="40" class="control"/><text x="445" y="791" text-anchor="middle" class="small">Next →</text>
        <text x="900" y="791" class="small muted">Page 1 / 3</text>
      </g>
    </g>
    <g id="course-detail-panel">
      <rect x="1092" y="354" width="470" height="468" class="panel"/>
      <text x="1118" y="389" class="section">Course detail</text>
      <line x1="1118" y1="405" x2="1536" y2="405" class="grid"/>
      <text x="1118" y="434" class="label">06016401</text>
      <text x="1118" y="461" class="body">Data Structures</text>
      <g id="course-facts">
        <text x="1118" y="503" class="small muted">Credits</text><text x="1240" y="503" class="small">3 (2-2-5)</text>
        <line x1="1118" y1="514" x2="1536" y2="514" class="grid"/>
        <text x="1118" y="540" class="small muted">Category</text><text x="1240" y="540" class="small">Major required</text>
        <line x1="1118" y1="551" x2="1536" y2="551" class="grid"/>
        <text x="1118" y="577" class="small muted">Prerequisite</text><text x="1240" y="577" class="small">Intro to Programming</text>
        <line x1="1118" y1="588" x2="1536" y2="588" class="grid"/>
      </g>
      <g id="course-description">
        <text x="1118" y="619" class="label">Description</text>
        <text x="1118" y="646" class="small">Representative summary of course content</text>
        <text x="1118" y="668" class="small">and learning topics.</text>
      </g>
      <g id="course-placements">
        <text x="1118" y="710" class="label">Placements</text>
        <text x="1132" y="738" class="small">• Year 2, Semester 1</text>
        <text x="1132" y="762" class="small">• Plan A</text>
      </g>
    </g>
  </g>
</svg>
