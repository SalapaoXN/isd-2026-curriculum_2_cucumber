name: Validate curriculum corrections once

on:
  push:
    paths:
      - ".github/workflows/validate-corrections-once.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai python-dotenv "python-Levenshtein==0.27.4" "pythainlp==5.3.7"

      - name: Run correction and fail-closed tests
        run: |
          python -m unittest tests.tools.test_llm_spell_corrector -v
          python -m unittest tests.tools.test_source_credit_reconciliation tests.pipeline.test_merge_credit_provenance -v

      - name: Verify corrected canonical values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def course(path, code):
              doc = json.loads(Path(path).read_text(encoding="utf-8"))
              rows = [c for c in doc["courses"] if c.get("code") == code]
              assert len(rows) == 1, (path, code, len(rows))
              return rows[0]

          for path in (
              "data/output/final/merged_it_coop_full_corrected.json",
              "data/output/final/merged_it_no_coop_full_corrected.json",
          ):
              assert course(path, "06066302")["name_th"] == "การเขียนโปรแกรมเว็บพื้นฐาน"
              assert course(path, "06016465")["name_th"] == "การออกแบบศูนย์ข้อมูล"

          gened = course(
              "data/output/final/merged_gened_gened_edition-gened-2564_full_corrected.json",
              "90642045",
          )
          assert gened["name_en"] == "BE MY BEV."

          bit = course("data/output/final/merged_bit_coop_full_corrected.json", "06036135")
          assert bit["credits"] == "", bit["credits"]
          print("canonical assertions: PASS")
          PY

      - name: Regenerate current GT-backed evaluation
        run: |
          python -m src.pipeline.tools.evaluation.evaluate \
            --pair data/output/final/merged_ait_no_plan_full_corrected.json ground_truth/AIT/AIT_academic_plan.json \
            --pair data/output/final/merged_bit_coop_full_corrected.json ground_truth/BIT/BIT_academic_plan_coop.json \
            --pair data/output/final/merged_bit_no_coop_full_corrected.json ground_truth/BIT/BIT_academic_plan_no_coop.json \
            --pair data/output/final/merged_dsba_coop_full_corrected.json ground_truth/DSBA/DSBA_academic_plan_coop.json \
            --pair data/output/final/merged_dsba_no_coop_full_corrected.json ground_truth/DSBA/DSBA_academic_plan_no_coop.json \
            --pair data/output/final/merged_gened_gened_edition-gened-2564_full_corrected.json ground_truth/general_education_ground_truth.json \
            --pair data/output/final/merged_it_coop_full_corrected.json ground_truth/IT/IT_academic_plan_coop.json \
            --pair data/output/final/merged_it_no_coop_full_corrected.json ground_truth/IT/IT_academic_plan_no_coop.json \
            > /tmp/evaluation.json

      - name: Verify evaluation regressions
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          summary = list(csv.DictReader(Path("reports/evaluation/evaluation_summary.csv").open(encoding="utf-8-sig")))
          assert len(summary) == 8
          for row in summary:
              assert row["precision_percent"] == "100.0", row
              assert row["recall_percent"] == "100.0", row
              assert row["f1_percent"] == "100.0", row

          errors = Path("reports/evaluation/evaluation_errors.csv").read_text(encoding="utf-8-sig")
          assert "06066302,name_th" not in errors
          assert "06016465,name_th" not in errors
          assert "90642045,name_en" not in errors
          print("evaluation regression checks: PASS")
          PY

      - name: Commit refreshed evaluation reports
        run: |
          if git diff --quiet -- reports/evaluation; then
            echo "No report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/evaluation/evaluation.json \
                  reports/evaluation/evaluation_summary.csv \
                  reports/evaluation/field_metrics.csv \
                  reports/evaluation/evaluation_errors.csv
          git commit -m "reports: refresh evaluation after data fixes"
          git push origin HEAD:heart
