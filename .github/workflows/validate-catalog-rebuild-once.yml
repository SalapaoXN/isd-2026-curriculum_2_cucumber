name: Validate catalog rebuild once

on:
  push:
    paths:
      - ".github/workflows/validate-catalog-rebuild-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused runtime dependencies
        run: python -m pip install numpy sqlite-vec python-dotenv

      - name: Run repository catalog regression
        run: |
          python -m unittest \
            tests.rag.test_rag_supplemental_loader.RagSupplementalLoaderTest.test_repository_corrected_documents_resolve_program_requirements \
            -v

      - name: Exercise full default rebuild path with deterministic embeddings
        run: |
          python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path

          import numpy as np

          from rag.build_index import _default_sources, _default_supplemental_sources
          from rag.retrieval.index import ensure_index

          def fake_embed(texts):
              values = list(texts)
              return np.zeros((len(values), 384), dtype=np.float32)

          with tempfile.TemporaryDirectory() as directory:
              db = ensure_index(
                  _default_sources(),
                  index_path=Path(directory) / "curriculum.db",
                  embed_texts_callable=fake_embed,
                  embedding_model_identity="catalog-rebuild-test",
                  vector_dimension=384,
                  supplemental_json_paths=_default_supplemental_sources(),
              )
              with sqlite3.connect(db) as connection:
                  bit_catalogs = connection.execute(
                      "SELECT catalog_key, COUNT(*) FROM catalogs "
                      "WHERE catalog_key = 'bit-2565' GROUP BY catalog_key"
                  ).fetchall()
                  requirement = connection.execute(
                      "SELECT value FROM program_requirements "
                      "JOIN catalogs USING (catalog_id) "
                      "WHERE catalogs.catalog_key = 'bit-2565' "
                      "AND program_code = 'BIT'"
                  ).fetchall()

              assert bit_catalogs == [("bit-2565", 1)], bit_catalogs
              assert requirement == [(126,)], requirement
              print(f"default rebuild path: PASS -> {db}")
          PY
