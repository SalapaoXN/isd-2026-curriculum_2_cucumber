name: Demo smoke test once

on:
  push:
    paths:
      - ".github/workflows/demo-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install focused Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy sqlite-vec google-genai python-dotenv fastapi httpx uvicorn transformers sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Fresh-clone frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: HTTP page smoke
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.main import app
          client = TestClient(app)
          for path in ("/chat", "/curriculum", "/api/health"):
              r = client.get(path)
              print(path, r.status_code, r.headers.get("content-type"))
              assert r.status_code == 200
          PY

      - name: Curriculum QA smoke
        run: |
          python - <<'PY'
          from rag.hybrid_demo import answer_question_once
          from rag.query_spec import parse_query_spec

          DB = "cucumber_outputs/runtime/curriculum.db"
          cases = [
              ("IT แผนสหกิจ รวมทั้งหมดกี่หน่วยกิต", {"program":"IT","catalog_key":"it-2565"}),
              ("IT แผนไม่สหกิจ รวมทั้งหมดกี่หน่วยกิต", {"program":"IT","catalog_key":"it-2565"}),
              ("DSBA แผนสหกิจ รวมทั้งหมดกี่หน่วยกิต", {"program":"DSBA","catalog_key":"dsba-2565"}),
              ("DSBA แผนไม่สหกิจ รวมทั้งหมดกี่หน่วยกิต", {"program":"DSBA","catalog_key":"dsba-2565"}),
              ("มีวิชาเกี่ยวกับ data อะไรบ้าง", {"program":"IT","catalog_key":"it-2565"}),
              ("มีวิชาเกี่ยวกับฐานข้อมูลอะไรบ้าง", {"program":"IT","catalog_key":"it-2565"}),
              ("มีวิชาเกี่ยวกับ AI อะไรบ้าง", {"program":"IT","catalog_key":"it-2565"}),
              ("มีวิชาเกี่ยวกับ cybersecurity อะไรบ้าง", {"program":"IT","catalog_key":"it-2565"}),
          ]

          for question, context in cases:
              spec = parse_query_spec(question)
              result = answer_question_once(DB, question, conversation_context=context)
              print("\nQUESTION:", question)
              print("PARSE:", {
                  "program": spec.program,
                  "plans": spec.plans,
                  "years": spec.years,
                  "semesters": spec.semesters,
                  "topic": spec.topic,
                  "operations": spec.operations,
              })
              print("STATUS:", result.get("status") or getattr(result.get("result"), "status", None))
              print("ANSWER:", result.get("final_answer") or result.get("answer") or result.get("result"))
              prov = result.get("provenance") or ()
              print("PROVENANCE_COUNT:", len(prov))
          PY
