name: Demo smoke test once
# rerun after topic and total fixes
# rerun after runtime provenance adjustment

on:
  push:
    paths:
      - ".github/workflows/demo-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install focused Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy sqlite-vec google-genai python-dotenv fastapi httpx uvicorn transformers sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Fresh-clone frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: HTTP page smoke
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.main import app
          client = TestClient(app)
          for path in ("/chat", "/curriculum", "/api/health"):
              r = client.get(path)
              print(path, r.status_code, r.headers.get("content-type"))
              assert r.status_code == 200
          PY

      - name: Curriculum QA smoke
        run: |
          python - <<'PY'
          from rag.hybrid_demo import answer_question_once
          from rag.query_spec import parse_query_spec

          DB = "cucumber_outputs/runtime/curriculum.db"

          total_cases = [
              ("IT แผนสหกิจ รวมทั้งหมดกี่หน่วยกิต", {"program":"IT","catalog_key":"it-2565"}, 129, "coop"),
              ("IT แผนไม่สหกิจ รวมทั้งหมดกี่หน่วยกิต", {"program":"IT","catalog_key":"it-2565"}, 129, "no_coop"),
              ("DSBA แผนสหกิจ รวมทั้งหมดกี่หน่วยกิต", {"program":"DSBA","catalog_key":"dsba-2565"}, 132, "coop"),
              ("DSBA แผนไม่สหกิจ รวมทั้งหมดกี่หน่วยกิต", {"program":"DSBA","catalog_key":"dsba-2565"}, 132, "no_coop"),
          ]
          for question, context, expected_total, expected_plan in total_cases:
              spec = parse_query_spec(question)
              result = answer_question_once(DB, question, conversation_context=context)
              answer = result.get("final_answer") or ""
              provenance = result.get("provenance") or ()
              print("\nQUESTION:", question)
              print("PARSE:", {"plans": spec.plans, "operations": spec.operations})
              print("ANSWER:", answer)
              print("PROVENANCE:", provenance)
              assert result.get("status") == "answer", result
              assert str(expected_total) in answer, answer
              assert "ปี 1 ภาคเรียน" not in answer, answer
              assert provenance, result
              assert all(ref.get("document_category") == "plan" for ref in provenance), provenance

          topic_cases = [
              ("มีวิชาเกี่ยวกับ data อะไรบ้าง", "data"),
              ("มีวิชาเกี่ยวกับฐานข้อมูลอะไรบ้าง", "database"),
              ("มีวิชาเกี่ยวกับ AI อะไรบ้าง", "AI"),
              ("มีวิชาเกี่ยวกับ cybersecurity อะไรบ้าง", "cybersecurity"),
              ("วิชาที่เกี่ยวกับ machine learning มีอะไรบ้าง", "machine learning"),
          ]
          for question, expected_topic in topic_cases:
              spec = parse_query_spec(question, has_validated_context_scope=True)
              result = answer_question_once(
                  DB,
                  question,
                  conversation_context={"program":"IT","catalog_key":"it-2565"},
              )
              answer = result.get("final_answer") or ""
              provenance = result.get("provenance") or ()
              print("\nQUESTION:", question)
              print("PARSE:", {"topic": spec.topic, "operations": spec.operations})
              print("STATUS:", result.get("status"))
              print("ANSWER_LINES:", len(answer.splitlines()))
              print("ANSWER:", answer)
              assert spec.topic == expected_topic, spec
              assert spec.operations == ("list",), spec
              assert result.get("status") == "answer", result
              assert provenance, result
              # A topic query must not silently widen to the entire IT plan.
              assert len(answer.splitlines()) < 80, len(answer.splitlines())
          PY

      - name: Focused regression
        run: |
          python -m unittest \
            tests.rag.test_query_spec \
            tests.rag.test_rag_policy \
            tests.rag.test_rag_qa \
            tests.test_llm_sql_api \
            -v
